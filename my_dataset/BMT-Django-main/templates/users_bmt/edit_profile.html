{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>แก้ไขโปรไฟล์</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-50">
  <div class="max-w-lg mx-auto mt-10 bg-white rounded-2xl shadow p-6">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6">แก้ไขโปรไฟล์</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-gray-700 mb-1">ชื่อผู้ใช้:</label>
        <input type="text" value="{{ user.username }}" disabled
               class="w-full rounded-lg border-gray-300 bg-gray-100 px-3 py-2" />
      </div>

      <div>
        <label class="block text-gray-700 mb-1">อีเมล:</label>
        <input type="email" value="{{ user.email }}" disabled
               class="w-full rounded-lg border-gray-300 bg-gray-100 px-3 py-2" />
      </div>

      <div>
        <label class="block text-gray-700 mb-1">เบอร์โทรศัพท์:</label>
        <input type="text" name="phone" value="{{ profile.phone|default:'' }}"
               class="w-full rounded-lg border-gray-300 px-3 py-2 focus:ring focus:ring-indigo-200" />
      </div>

      <div class="flex justify-between mt-6">
        <a href="{% url 'profile' %}" 
           class="rounded-lg bg-gray-200 px-4 py-2 text-gray-700 hover:bg-gray-300">
          ยกเลิก
        </a>

        <button type="submit"
                class="rounded-lg bg-indigo-600 px-4 py-2 text-white hover:bg-indigo-700">
           บันทึกการเปลี่ยนแปลง
        </button>
      </div>
    </form>
  </div>
</body>
</html>
