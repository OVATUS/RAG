{% comment %} profile.html {% endcomment %}
{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>โปรไฟล์ของฉัน</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-50">
  <div class="max-w-lg mx-auto mt-10 bg-white rounded-2xl shadow p-6">
    <h1 class="text-2xl font-bold text-indigo-700 mb-6">โปรไฟล์ผู้ใช้</h1>

    <p><strong>ชื่อผู้ใช้:</strong> {{ user.username }}</p>
    <p><strong>อีเมล:</strong> {{ user.email }}</p>

    {% if profile.phone %}
      <p><strong>เบอร์โทร:</strong> {{ profile.phone }}</p>
    {% endif %}

    <div class="mt-6 flex flex-wrap gap-2">
      <a href="{% url 'court_list' %}" 
         class="inline-block rounded-lg bg-gray-200 px-4 py-2 text-gray-700 hover:bg-gray-300">
        &larr; กลับหน้าหลัก
      </a>

      <a href="{% url 'edit_profile' %}" 
         class="inline-block rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-600">
         แก้ไขโปรไฟล์
      </a>

      <a href="{% url 'deactivate_confirm' %}"
         class="rounded-lg bg-red-100 text-red-700 px-3 py-2 hover:bg-red-200">
        ปิดการใช้งานบัญชี
      </a>
    </div>
  </div>
</body>
</html>
