{# templates/users/deactivate_confirm.html #}
{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>ปิดการใช้งานบัญชี</title>
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-50 grid place-items-center">
  <div class="bg-white rounded-2xl shadow p-6 w-full max-w-md">
    <h1 class="text-xl font-bold text-red-600">ปิดการใช้งานบัญชี</h1>
    <p class="mt-2 text-gray-700">
      เมื่อปิดการใช้งาน คุณจะไม่สามารถเข้าสู่ระบบได้อีก
    </p>
    <form method="post" action="{% url 'deactivate_me' %}" class="mt-6 flex gap-3">
      {% csrf_token %}
      <button class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700">ยืนยันปิดการใช้งาน</button>
      <a href="{% url 'profile' %}" class="px-4 py-2 rounded-lg bg-gray-200 text-gray-700 hover:bg-gray-300">ยกเลิก</a>
    </form>
  </div>
</body>
</html>
