{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>แก้ไขการจอง</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  {% tailwind_css %}
</head>
<body class="min-h-screen bg-gray-50 grid place-items-center">
  <div class="bg-white rounded-2xl shadow p-6 w-full max-w-md">
    <h1 class="text-xl font-bold text-indigo-700">แก้ไขการจอง: {{ booking.court.name }}</h1>
    <p class="text-sm text-gray-600">จาก {{ booking.start_at|date:"d/m/Y H:i" }} → {{ booking.end_at|date:"H:i" }}</p>

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-800">วัน</label>
        {{ form.day.errors }}
        <input type="date" name="{{ form.day.name }}" value="{{ form.day.value|default:'' }}"
               class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-800">รอบเวลา</label>
        {{ form.slot.errors }}
        <select name="{{ form.slot.name }}" class="mt-1 w-full rounded-lg border-gray-300 focus:border-indigo-500 focus:ring-indigo-500">
          {% for val, label in form.fields.slot.choices %}
            <option value="{{ val }}" {% if form.slot.value == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex gap-3">
        <button class="rounded-lg bg-indigo-600 text-white px-4 py-2 hover:bg-indigo-700">บันทึก</button>
        <a href="{% url 'booking_history' %}" class="rounded-lg bg-gray-200 px-4 py-2 text-gray-700 hover:bg-gray-300">ยกเลิก</a>
      </div>
    </form>
  </div>
</body>
</html>
